[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-forensics-framework"
version = "0.1.0"
description = "Automated malware-oriented binary analysis and incident timeline generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Auto Forensics Team" }]
dependencies = ["rich>=14.3.3"]

[project.optional-dependencies]
pe = ["pefile>=2024.8.26"]
evtx = ["python-evtx>=0.8.1"]
pcap = ["dpkt>=1.9.8"]
registry = ["python-registry>=1.3.1"]
yara = ["yara-python>=4.5.4"]
sigma = ["pyyaml>=6.0.3"]
memory = ["volatility3>=2.8.0"]
pdf = ["reportlab>=4.4.10"]
db = ["sqlalchemy>=2.0.48", "psycopg[binary]>=3.3.3"]
server = ["fastapi>=0.135.1,<1.0.0", "uvicorn>=0.42.0,<1.0.0"]
dev = ["pytest>=8.0.0,<9.0.0", "mypy>=1.0.0"]
tui = ["textual>=0.85.0"]
mount = ["pyewf>=20230709", "pytsk3>=20231210"]
tray = ["pystray>=0.19.5", "Pillow>=12.1.1"]
desktop = ["pywebview>=5.4"]
build = ["pyinstaller>=6.19.0"]

[project.scripts]
auto-forensics = "auto_forensics.cli:main"
auto-forensics-api = "auto_forensics.api:main"
auto-forensics-app = "auto_forensics.desktop:main"
auto-forensics-launcher = "auto_forensics.launcher:main"
auto-forensics-tui = "auto_forensics.tui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_forensics = ["tui/styles.css"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
show_error_context = true

[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pefile.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "evtx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dpkt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "registry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yara.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "volatility3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pystray.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pywebview.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "textual.*"
ignore_missing_imports = true
