[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-forensics-framework"
version = "0.1.0"
description = "Automated malware-oriented binary analysis and incident timeline generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Auto Forensics Team" }]
dependencies = ["rich>=13.0.0"]

[project.optional-dependencies]
pe = ["pefile>=2023.2.7"]
evtx = ["python-evtx>=0.8.1"]
pcap = ["dpkt>=1.9.8"]
registry = ["python-registry>=1.3.1"]
yara = ["yara-python>=4.5.1"]
sigma = ["pyyaml>=6.0.2"]
memory = ["volatility3>=2.8.0"]
pdf = ["reportlab>=4.2.2"]
db = ["sqlalchemy>=2.0.36", "psycopg[binary]>=3.2.9"]
server = ["fastapi>=0.110.0,<1.0.0", "uvicorn>=0.30.0,<1.0.0"]
dev = ["pytest>=8.0.0,<9.0.0"]

[project.scripts]
auto-forensics = "auto_forensics.cli:main"
auto-forensics-api = "auto_forensics.api:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_forensics = []
