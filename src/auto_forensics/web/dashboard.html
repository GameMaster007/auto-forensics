<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Forensics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
    <nav class="topnav">
        <div class="nav-brand">
            <div class="nav-logo">
                <!-- Forensics spark icon -->
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8.5 1L3 8.5h4.5L7 15l6-8H8.5L8.5 1z"/>
                </svg>
            </div>
            <span class="nav-title">Auto Forensics</span>
        </div>
        <div class="nav-right">
            <div id="health-pill" class="health-pill">
                <span class="health-dot"></span>
                <span id="health-text">Connecting</span>
            </div>
            <button id="refresh-btn" class="btn-icon" title="Refresh">&#8635;</button>
        </div>
    </nav>

    <main class="main">
        <section class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">—</div>
                <div class="stat-label">Total Cases</div>
            </div>
            <div class="stat-card stat-card--success">
                <div class="stat-value" id="stat-complete">—</div>
                <div class="stat-label">Complete</div>
            </div>
            <div class="stat-card stat-card--warn">
                <div class="stat-value" id="stat-analyzing">—</div>
                <div class="stat-label">Analyzing</div>
            </div>
            <div class="stat-card stat-card--danger">
                <div class="stat-value" id="stat-failed">—</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card stat-card--accent">
                <div class="stat-value" id="stat-ready">—</div>
                <div class="stat-label">Ready</div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Cases</h2>
                <div class="filter-row">
                    <input type="search" id="search-input" class="search-input"
                           placeholder="Search by case ID..." autocomplete="off">
                    <select id="status-filter" class="select-input">
                        <option value="">All statuses</option>
                        <option value="created">Created</option>
                        <option value="ready">Ready</option>
                        <option value="ingesting">Ingesting</option>
                        <option value="analyzing">Analyzing</option>
                        <option value="complete">Complete</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
            </div>
            <div id="cases-container">
                <div class="placeholder">Loading cases...</div>
            </div>
        </section>
    </main>

    <aside id="detail-drawer" class="drawer drawer--hidden">
        <div class="drawer-header">
            <span id="drawer-title" class="drawer-title">—</span>
            <button id="drawer-close" class="btn-icon" title="Close">&#x2715;</button>
        </div>
        <div id="drawer-body" class="drawer-body">
            <div class="placeholder">Loading...</div>
        </div>
    </aside>
    <div id="overlay" class="overlay overlay--hidden"></div>

    <script src="/assets/dashboard.js"></script>
</body>
</html>
